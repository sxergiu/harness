# The same four commands CLAUDE.md tells a human to run, in the same order, so
# a green run here means exactly what a green run locally means.
#
# `npm test` is the only one that could plausibly need a machine: it touches no
# Herdr socket, no network and no `~/.claude`, which is the whole selection rule
# for what lives in that suite — so it says the same thing on a runner as it does
# on a laptop with nine agents open.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    # All three, because the package no longer carries an `os` field and anybody
    # may now install it. This matrix is the ONLY evidence behind that: nothing
    # here is developed off macOS, so the gates on the other two runners are
    # what stands between "installable" and "installs and then fails".
    #
    # It also guards the specific thing that broke first. Windows runs npm
    # scripts through cmd.exe, where `mkdir -p`, `cp` and an unexpanded `*` do
    # not exist — the asset copy and the test glob were both POSIX shell and the
    # build would have died on contact.
    #
    # What it does NOT cover is Herdr itself. Every gate here is deliberately
    # machine-free (see the note above), so a green Windows run says the code
    # builds and the invariants hold there, not that the cockpit has ever talked
    # to a named pipe.
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's result is wanted, especially when one fails: a run that
      # stopped at the first red tells you nothing about the other two.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The floor `package.json` declares. Testing on the oldest supported
          # version is the point: a newer one would pass over an API that the
          # engines field promises works.
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Last, and not redundant: `dist/` does not rebuild itself, so this is the
      # only thing that catches a build broken by a change everything above is
      # happy with — a missing asset in the copy step, say.
      - run: npm run build
